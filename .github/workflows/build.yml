name: Build Connect IQ app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  # Keep in sync with the SDK version used for local dev builds (see
  # docs/TESTING.md). Bump this when upgrading the locally installed SDK.
  CIQ_SDK_VERSION: "9.2.0"

jobs:
  # Reads the product list straight out of manifest.xml so CI never drifts
  # from what's actually declared there (see manifest.xml's <iq:products>).
  determine-products:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      products: ${{ steps.parse.outputs.products }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: parse
        run: |
          products=$(grep -oP '(?<=<iq:product id=")[^"]+' manifest.xml | jq -R . | jq -sc .)
          echo "Products: $products"
          echo "products=$products" >> "$GITHUB_OUTPUT"

  # Fetches the SDK and the manifest's device definitions once and caches
  # them, so the 75-way device matrix below never hits Garmin (or logs in)
  # itself. The cache key includes manifest.xml, so adding a product
  # refreshes the device set.
  prepare-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache Connect IQ SDK and devices
        id: sdk-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ciq-sdk
            ~/.Garmin/ConnectIQ/Devices
          key: ciq-sdk-${{ env.CIQ_SDK_VERSION }}-linux-${{ hashFiles('manifest.xml') }}

      - name: Download Connect IQ SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: .github/scripts/download-sdk.sh
        env:
          CIQ_SDK_VERSION: ${{ env.CIQ_SDK_VERSION }}
          CIQ_SDK_URL: ${{ vars.CIQ_SDK_URL }}

      - name: Download Connect IQ devices
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: .github/scripts/download-devices.sh
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          CIQ_AGREEMENT_HASH: ${{ vars.CIQ_AGREEMENT_HASH }}

  build-devices:
    needs: [determine-products, prepare-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.determine-products.outputs.products) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Connect IQ SDK and devices
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ciq-sdk
            ~/.Garmin/ConnectIQ/Devices
          key: ciq-sdk-${{ env.CIQ_SDK_VERSION }}-linux-${{ hashFiles('manifest.xml') }}
          fail-on-cache-miss: true

      - name: Decode developer key
        env:
          GARMIN_DEVELOPER_KEY_BASE64: ${{ secrets.GARMIN_DEVELOPER_KEY_BASE64 }}
        run: .github/scripts/developer-key.sh

      - name: Build ${{ matrix.device }}
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          mkdir -p bin
          ciq-sdk/bin/monkeyc \
            -f monkey.jungle \
            -d "$DEVICE" \
            -o "bin/OrionSleep-$DEVICE.prg" \
            -y developer_key.der \
            -w

      - name: Clean up developer key
        if: always()
        run: rm -f developer_key.der

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: OrionSleep-${{ matrix.device }}
          path: bin/OrionSleep-${{ matrix.device }}.prg
          retention-days: 14

  build-store-package:
    needs: prepare-sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Connect IQ SDK and devices
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ciq-sdk
            ~/.Garmin/ConnectIQ/Devices
          key: ciq-sdk-${{ env.CIQ_SDK_VERSION }}-linux-${{ hashFiles('manifest.xml') }}
          fail-on-cache-miss: true

      - name: Decode developer key
        env:
          GARMIN_DEVELOPER_KEY_BASE64: ${{ secrets.GARMIN_DEVELOPER_KEY_BASE64 }}
        run: .github/scripts/developer-key.sh

      - name: Build signed .iq store package
        run: |
          mkdir -p bin
          ciq-sdk/bin/monkeyc \
            -e -r \
            -f monkey.jungle \
            -o bin/OrionSleep.iq \
            -y developer_key.der \
            -w

      - name: Clean up developer key
        if: always()
        run: rm -f developer_key.der

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: OrionSleep-store-package
          path: bin/OrionSleep.iq
          retention-days: 14
